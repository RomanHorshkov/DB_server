name: CI

# DB_server had no working CI at all. The only workflow file that existed
# (http_manager_it_tests.yml, removed by this same commit) built and ran a
# CMake project under tests/IT/ that referenced
# app/src/core/worker/operator/client/http_man/http_manager.c and
# sanitizer.c — files that don't exist in this tree. That logic was
# extracted into the separate DB_http repo at some point (which now owns
# app/src/sanitizer.c and has its own real tests — see DB_http's own ci.yml)
# and tests/IT/ was never updated or removed to match. It also only ran on
# workflow_dispatch against master, so its breakage was invisible on every
# normal push/PR anyway.
#
# tests/IT/'s dead CMake project is left in place (not deleted) — retiring
# the broken CI wiring is this commit's job; whether to migrate it to test
# DB_http instead or delete it outright is a call for whoever owns that
# decision, not something to make silently here.
#
# REQUIRES the SIBLING_REPOS_PAT repo secret (Settings -> Secrets and
# variables -> Actions on THIS repo specifically — GitHub Actions secrets are
# per-repo, never shared across repos even under the same owner). DB_server
# itself is public, but every sibling it links except SPSCring/fs_util/Utils
# is private, so the checkout of the first private one 404s without it.
#
# DB_server does NOT re-run DB_app's own test suite anymore (an earlier
# version of this file had a quality-db-app job doing exactly that — the
# single most expensive job here, ~30 minutes, entirely redundant with what
# DB_app's own ci.yml already verifies on every DB_app push). DB_server only
# needs DB_app's built LIBRARY to link against, not a re-verification of
# DB_app's own correctness — pulling in a sibling's release build and
# trusting its own CI is the same relationship DB_server has with every
# other sibling (DB_lmdb, DB_http, DB_jose, EMlog, uuid7, MPSCring,
# SPSCring). The effort that job used to spend gets spent on DB_server's OWN
# tests instead — see below.
#
# Shaped as a graph, not one monolithic job — same house pattern as
# EMlog/uuid7/SPSCring/MPSCring's quality.yml:
#
#   build (DB_app + siblings, build-only — fast fail-first gate)
#     +-- test-audit       (tests/*_tests.c under the audit profile)
#     +-- test-sanitize    (same, under ASan/UBSan/LSan — wired to a real
#     |                      test job for the first time; this profile was
#     |                      being BUILT every push and never actually run
#     |                      against DB_server's own concurrency code)
#     +-- test-release     (same, under release)
#     +-- test-integration (tests/spsc_dispatch_load_test.sh — boots the
#     |                      real db_server binary and drives concurrent
#     |                      HTTP load through the actual accept ->
#     |                      worker_dispatch_to_operator SPSC push ->
#     |                      operator epoll wakeup -> response path; this
#     |                      existed in the repo but was never wired into
#     |                      CI at all — plus tests/config_validation_test.sh,
#     |                      which boots the same real binary against several
#     |                      bad configs and one valid one, proving
#     |                      config_validate_startup() actually gates
#     |                      server_init(); plus tests/graceful_shutdown_test.sh
#     |                      (SIGTERM drains in-flight work + refuses new
#     |                      connections + exits cleanly), tests/emfile_backoff_
#     |                      test.sh (genuine process fd exhaustion survives
#     |                      without a busy-loop and recovers), tests/
#     |                      socket_activation_restart_test.sh (a service
#     |                      restart adopts the pre-existing systemd-owned
#     |                      listening socket without dropping queued
#     |                      connections), and tests/fault_injection_startup_
#     |                      test.sh (LD_PRELOAD fault injection — permission/
#     |                      EMFILE/rename failures on DB_app/DB_lmdb's direct
#     |                      fs calls fail cleanly, no corrupted state))
#     +--> package         (release + audit build, needs all four verdicts)
#
# Each needs:-build job re-checks-out and re-builds the full nine-repo
# sibling chain via the local `setup-siblings` composite action — jobs never
# share a filesystem without an explicit artifact upload/download, so this
# is real duplicated build time, not shared state. `build` earns its keep as
# a single fast fail point before spending five jobs' worth of runner time
# finding the same thing out separately.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (DB_app + siblings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DB_server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: DB_server
          persist-credentials: false

      - name: Setup siblings (checkout + build + install)
        uses: ./DB_server/.github/actions/setup-siblings
        with:
          sibling-token: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}

      - name: DB_app — build libraries only
        run: |
          cd DB_app
          ./utils/run_pipeline.sh build

  test-audit:
    name: Audit tests
    needs: build
    uses: ./.github/workflows/_test-profile.yml
    with: { profile: audit }
    secrets: inherit

  test-sanitize:
    name: ASan/UBSan/LSan tests
    needs: build
    uses: ./.github/workflows/_test-profile.yml
    with: { profile: sanitize }
    secrets: inherit

  test-release:
    name: Release tests
    needs: build
    uses: ./.github/workflows/_test-profile.yml
    with: { profile: release }
    secrets: inherit

  test-integration:
    name: Integration (real server, concurrent load)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DB_server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: DB_server
          persist-credentials: false

      - name: Setup siblings (checkout + build + install)
        uses: ./DB_server/.github/actions/setup-siblings
        with:
          sibling-token: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}

      - name: DB_app — build libraries only
        run: |
          cd DB_app
          ./utils/run_pipeline.sh build

      - name: DB_server — build the release binary
        run: |
          cd DB_server
          ./utils/build_bin.sh release

      - name: DB_server — spsc_dispatch_load_test.sh (boots the real binary)
        run: |
          cd DB_server
          ./tests/spsc_dispatch_load_test.sh

      - name: DB_server — config_validation_test.sh (boots the real binary, bad + valid configs)
        run: |
          cd DB_server
          ./tests/config_validation_test.sh

      - name: DB_server — graceful_shutdown_test.sh (SIGTERM drains + refuses new + exits cleanly)
        run: |
          cd DB_server
          ./tests/graceful_shutdown_test.sh

      - name: DB_server — emfile_backoff_test.sh (genuine fd exhaustion, no busy-loop, recovers)
        run: |
          cd DB_server
          ./tests/emfile_backoff_test.sh

      - name: DB_server — socket_activation_restart_test.sh (restart adopts the pre-existing socket)
        run: |
          cd DB_server
          ./tests/socket_activation_restart_test.sh

      - name: DB_server — fault_injection_startup_test.sh (permission/EMFILE/rename fail cleanly)
        run: |
          cd DB_server
          ./tests/fault_injection_startup_test.sh

  package:
    name: Package (release + audit) + install
    needs: [test-audit, test-sanitize, test-release, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DB_server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: DB_server
          persist-credentials: false

      - name: Setup siblings (checkout + build + install)
        uses: ./DB_server/.github/actions/setup-siblings
        with:
          sibling-token: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}

      - name: DB_app — build libraries only
        run: |
          cd DB_app
          ./utils/run_pipeline.sh build

      - name: DB_server — build (release + audit) + package
        run: |
          cd DB_server
          ./utils/run_pipeline.sh

      - name: Upload DB_server pipeline logs + package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db_server-pipeline
          if-no-files-found: warn
          path: |
            DB_server/build/pipeline/**
            DB_server/build/debs/*.deb
