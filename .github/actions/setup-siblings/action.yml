name: Setup DB_server siblings
description: >
  Installs the latest RELEASED .deb of every low-level sibling dependency DB_server (and the
  DB_app it links) transitively needs, instead of checking out and rebuilding each one from
  source on every job. Replaces the previous source-checkout design (2026-07-25): actions/checkout
  with no `ref:` pinned silently defaults to each sibling's own default branch, which drifted out
  of sync with what this repo's branch actually needed — this exact bug class broke DB_app's own
  CI against a stale DB_lmdb source checkout. Each low-level sibling now publishes its own .deb
  via its own release.yml (triggered by its own auto-tag-release.yml on every one of ITS master
  pushes), so `gh release download` always resolves to that sibling's actual latest stable,
  versioned artifact — never an ambiguous branch snapshot.

  DB_app is the one exception: it's a product repo, not a library, and deliberately has no
  release/auto-tag mechanism of its own (see docs/HARDENING_TODO.md's low-level-vs-product repo
  split). It still needs a real source checkout+build here — but pinned explicitly to
  `safety_upgrades` rather than left unpinned, since that's this whole project's actual active
  branch and the one DB_server's own work depends on; an unpinned checkout would have hit the
  exact same silent-wrong-branch bug this whole rewrite exists to close.

  A composite action, not a reusable workflow: this has to run as STEPS inside the calling job,
  not a separate job on its own runner, so the installed .debs / built DB_app land on the SAME
  filesystem the calling job's later steps (DB_server's own build/test) read from.

inputs:
  sibling-token:
    description: SIBLING_REPOS_PAT (or GITHUB_TOKEN fallback), passed explicitly — composite actions cannot read the secrets context directly. Needs at least read access to every sibling repo (releases for the low-level ones, source for DB_app).
    required: true

runs:
  using: composite
  steps:
    - name: Install apt dependencies
      shell: bash
      env: { DEBIAN_FRONTEND: noninteractive }
      run: |
        sudo apt-get -yqq update
        sudo apt-get -yqq install \
          build-essential pkg-config fakeroot \
          liblmdb-dev libsodium-dev zlib1g-dev libcmocka-dev gcovr

    - name: Install latest release of every low-level sibling
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.sibling-token }}
      run: |
        set -euo pipefail

        install_latest() {
          local repo="$1" pattern="$2"
          local dir="/tmp/sibling-debs/${repo}"
          echo "::group::${repo} (${pattern})"
          mkdir -p "${dir}"
          gh release download --repo "RomanHorshkov/${repo}" --pattern "${pattern}" --dir "${dir}" --clobber
          sudo apt-get install -y "${dir}"/${pattern}
          echo "::endgroup::"
        }

        install_latest EMlog     'emlog_*.deb'
        install_latest uuid7     'uuid7_*.deb'
        install_latest MPSCring  'mpscring_*.deb'
        install_latest SPSCring  'spscring_*.deb'
        install_latest Utils     'rh-util-*.deb'
        install_latest DB_http   'db-http_*.deb'

        sudo ldconfig

        install_latest DB_jose   'libdb-jose-dev_*.deb'
        install_latest DB_lmdb   'libdb-lmdb-dev_*.deb'

        sudo ldconfig

    - name: Checkout DB_app (sibling — product repo, no release mechanism, pinned to the active branch)
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: RomanHorshkov/DB_app
        ref: safety_upgrades
        path: DB_app
        token: ${{ inputs.sibling-token }}
        persist-credentials: false
